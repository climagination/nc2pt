# select.yaml
# Defines time and spatial subsetting parameters for the dataset.
# These are used to crop the input data temporally and spatially before processing.

select:
  # ───── Temporal subsetting ─────
  time:
    # Define the full available date range
    range:
      start: "20001201T06:00:00"
      end: "20160101T12:00:00"

    # Select years to reserve for testing and validation
    # Remaining years are used for training
    test_years: [2014]
    validation_years: [2015]

  # ───── Spatial subsetting ─────
  spatial:
    scale_factor: 8  # Factor to downscale HR data to LR
    x:
      first_index: 125
      last_index: 253
    y:
      first_index: 100
      last_index: 228