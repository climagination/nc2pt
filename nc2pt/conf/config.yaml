# config.yaml
# This is the top-level configuration for running the nc2pt pipeline.
# It defines all inputs, models, and pipeline behaviour using Hydra.
#
# Notes:
# - Variables from different models (e.g. HR vs LR) can be aligned using `alternative_names`
# - Dimensions and coordinates can be flagged as hr_only/lr_only to apply selectively
# - Each `_target_` maps to a dataclass in `climatedata.py`, which defines how the config is instantiated

defaults:
  - injections           # Loads all climate models/variables into `internal`
  - _self_               # Allow config.yaml to override earlier defaults
  - dims                 # Time and spatial dimension definitions
  - coords               # Coordinate dimension definitions
  - select               # Spatial and temporal subsetting
  - compute              # Engine and chunking options
  - loader               # Loader config (batch size, shuffling, etc.)

_target_: nc2pt.climatedata.ClimateData
output_path: /home/username/output/path

# Define the list of climate models to include (injected in `injections.yaml`)
climate_models:
  - ${internal.hr}
  - ${internal.lr}
  #- ${internal.lr_invariant}
  - ${internal.hr_invariant}
  #- ${internal.lr_emulation}
  #- ${internal.my_model}